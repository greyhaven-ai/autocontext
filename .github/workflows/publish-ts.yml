name: publish-ts

on:
  push:
    tags:
      - "ts-v*"
  workflow_dispatch:

concurrency:
  group: publish-ts-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      sha: ${{ steps.authorize.outputs.sha }}
    steps:
      # Load policy from protected main, before executing any release source.
      # Tag rules and registry environment binding must also protect this workflow.
      - name: Check out trusted release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: release-policy
          persist-credentials: false
      - name: Authorize release source and exact-commit CI
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 release-policy/scripts/check_release_source.py --tag-prefix ts-v

  build-npm:
    needs: validate-source
    runs-on: ubuntu-latest
    env:
      # Delay fresh npm versions during publish workflow dependency installs.
      NPM_CONFIG_MIN_RELEASE_AGE: "7"
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
          no-cache: true
      - name: Validate tag matches TypeScript package version
        if: startsWith(github.ref, 'refs/tags/ts-v')
        run: |
          expected="${GITHUB_REF_NAME#ts-v}"
          actual="$(node -p "require('./package.json').version")"
          if [ "$actual" != "$expected" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match ts/package.json version ${actual}." >&2
            exit 1
          fi
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Audit npm and Bun production locks
        run: |
          npm audit --omit=dev --audit-level=moderate
          bun audit --prod --audit-level=moderate
      - name: Show npm version
        run: npm --version
      - name: Build package
        run: npm run build
      - name: Generate CycloneDX SBOM
        run: npm sbom --omit=dev --sbom-format cyclonedx > autoctx.cdx.json
      - name: Pack immutable publish artifact
        run: npm pack --ignore-scripts
      - name: Upload package and SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ts-package
          path: |
            ts/*.tgz
            ts/autoctx.cdx.json
          retention-days: 7

  publish-npm:
    needs: build-npm
    runs-on: ubuntu-latest
    environment: publish-ts
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: "https://registry.npmjs.org"
      - name: Download verified package artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ts-package
          path: dist
      - name: Publish to npm with provenance
        run: npm publish dist/*.tgz --ignore-scripts --access public --provenance
