name: CPU measured pilot

on:
  pull_request:
    paths:
      - '.github/workflows/cpu-measured-pilot.yml'
      - 'autocontext/src/autocontext/weight_evolution/**'
      - 'autocontext/tests/test_weight_cpu_pilot*.py'
      - 'autocontext/tests/fixtures/weight_reproduction/cpu_pilot*'
      - 'autocontext/pyproject.toml'
      - 'autocontext/uv.lock'
      - 'examples/weight_evolution/cpu_pilot/**'
  workflow_dispatch:

permissions:
  contents: read

# Keep each source revision's evidence, including failed or cancelled attempts.
# A newer revision does not cancel a running declared pilot.
concurrency:
  group: cpu-measured-pilot-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  linux-amd64-pilot:
    runs-on: ubuntu-24.04
    # Full-prefix verification is intentionally repeated before later dispatch.
    timeout-minutes: 90
    env:
      CUDA_VISIBLE_DEVICES: ''
      AUTOCONTEXT_AGENT_PROVIDER: deterministic
      PYTHONDONTWRITEBYTECODE: '1'
    defaults:
      run:
        working-directory: autocontext
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Declare a fresh evidence directory
        run: echo "PILOT_EVIDENCE=$RUNNER_TEMP/cpu-measured-pilot-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          version: '0.12.7'
          enable-cache: false
      - name: Install locked CPU dependencies
        run: uv sync --locked --group dev
      - name: Run one declared measured CPU pilot and guarded replay
        run: >-
          uv run --frozen python ../examples/weight_evolution/cpu_pilot/acceptance.py
          --output "$PILOT_EVIDENCE"
          --campaign-id "cpu-measured-pilot-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          --execution-context github-actions-linux-amd64
      - name: Preserve complete or partial pilot evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cpu-measured-pilot-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ env.PILOT_EVIDENCE }}
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
