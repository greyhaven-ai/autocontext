name: publish-python

on:
  push:
    tags:
      - "py-v*"
  workflow_dispatch:

concurrency:
  group: publish-python-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-source:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: read
    outputs:
      sha: ${{ steps.authorize.outputs.sha }}
    steps:
      # Load policy from protected main, before executing any release source.
      # Tag rules and registry environment binding must also protect this workflow.
      - name: Check out trusted release policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: release-policy
          persist-credentials: false
      - name: Authorize release source and exact-commit CI
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 release-policy/scripts/check_release_source.py --tag-prefix py-v

  build-python:
    needs: validate-source
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: autocontext
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate-source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Validate tag matches Python package version
        if: startsWith(github.ref, 'refs/tags/py-v')
        run: |
          python - <<'PY'
          import os
          import sys
          import tomllib

          with open("pyproject.toml", "rb") as fh:
              version = tomllib.load(fh)["project"]["version"]

          tag = os.environ["GITHUB_REF_NAME"]
          expected = tag.removeprefix("py-v")
          if version != expected:
              print(
                  f"Tag {tag!r} does not match autocontext/pyproject.toml version {version!r}.",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.7"
          enable-cache: false
      - name: Install pinned audit dependencies
        run: uv sync --locked --group dev
      - name: Audit every dependency group and extra
        run: |
          uv export --quiet --locked --all-groups --all-extras --no-emit-project --format requirements-txt --output-file /tmp/autocontext-all-requirements.lock
          uv run --frozen python ../scripts/audit_python_dependencies.py /tmp/autocontext-all-requirements.lock
      - name: Generate CycloneDX SBOM
        run: uv export --locked --all-groups --all-extras --format cyclonedx1.5 --output-file autocontext-python.cdx.json
      - name: Build Python package
        run: >-
          uv build
          --build-constraints ../infra/docker/build-requirements.lock
          --require-hashes
      - name: Upload Python dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-dist
          path: |
            autocontext/dist/*.whl
            autocontext/dist/*.tar.gz
          retention-days: 7
      - name: Upload Python SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-sbom
          path: autocontext/autocontext-python.cdx.json
          retention-days: 7

  publish-pypi:
    needs: build-python
    runs-on: ubuntu-latest
    environment: publish-python
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download Python dist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
          attestations: true
