name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Delay fresh npm versions in CI during supply-chain incidents.
  NPM_CONFIG_MIN_RELEASE_AGE: "7"

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: autocontext
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: false
      - name: Install
        run: uv sync --locked --group dev
      - name: Verify container dependency locks
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file ../infra/docker/requirements.lock
          uv pip compile ../infra/docker/build-requirements.in --generate-hashes --exclude-newer 2026-06-20T00:00:00Z --output-file ../infra/docker/build-requirements.lock
          git diff --exit-code -- ../infra/docker/requirements.lock ../infra/docker/build-requirements.lock
      - name: Ruff
        run: uv run ruff check src tests
      - name: Mypy
        run: uv run mypy src
      - name: Protocol parity check
        run: uv run python ../scripts/generate_protocol.py --check
      - name: Markdown link integrity
        run: uv run python ../scripts/check_markdown_links.py

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: autocontext
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: false
      - name: Install
        run: uv sync --locked --group dev
      - name: Tests
        run: uv run pytest --cov=src/autocontext --cov-report=html:htmlcov -m "not live"
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage-report
          path: autocontext/htmlcov/
          retention-days: 14

  sandbox-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: autocontext
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: false
      - name: Install
        run: uv sync --locked --group dev
      - name: Verify Docker isolation and clean remote package
        env:
          AUTOCONTEXT_RUN_DOCKER_TESTS: "1"
        run: >-
          uv run pytest -q
          tests/test_research_workspace.py::test_real_docker_workspace_is_transactional_and_cannot_read_unmounted_host
          tests/test_scenario_remote_package.py::test_custom_package_runs_in_exact_clean_network_denied_runtime_image
          tests/test_workspace_interpreter_settings.py::test_production_setting_selects_a_live_isolated_workspace

  kernel-lifecycle-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: autocontext
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: false
      - name: Install
        run: uv sync --locked --group dev
      - name: Package import smoke
        run: >-
          uv run python -c
          "import autocontext.context_bundles;
          import autocontext.execution;
          import autocontext.kernel_evolution"
      - name: Portable lineage and benchmark lifecycle tests
        run: >-
          uv run pytest
          tests/test_file_lock.py
          tests/test_kernel_lineage_lock.py
          tests/test_kernel_benchmark_contract.py
          -q
      - name: Portable confined storage tests
        run: >-
          uv run pytest
          tests/test_confined_files.py
          tests/test_knowledge_endpoint.py::test_put_writes_knowledge_files_and_get_round_trips
          tests/test_fixture_loader.py::TestFixtureCache::test_put_and_get_roundtrip
          tests/test_distill_jobs.py::TestDistillJobManager::test_create_job
          tests/test_distill_jobs.py::TestDistillJobManager::test_get_job
          tests/test_distill_jobs.py::TestDistillJobManager::test_list_jobs
          -q

  package-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: false
      - name: Install Python deps
        working-directory: autocontext
        run: uv sync --locked --group dev
      - name: Install TypeScript deps
        working-directory: ts
        run: npm ci --ignore-scripts
      - name: Python package boundary checks
        working-directory: autocontext
        run: uv run pytest tests/test_package_topology.py tests/test_package_boundaries.py -q
      - name: TypeScript package boundary checks
        working-directory: ts
        run: npx vitest run tests/package-topology.test.ts tests/package-boundaries.test.ts
      - name: Source dependency boundary ratchet
        run: |
          python scripts/test_dependency_boundaries.py
          python scripts/check_dependency_boundaries.py
      - name: Role output schema drift check
        working-directory: autocontext
        run: uv run --frozen python scripts/generate_role_output_schemas.py --check
      - name: Python/TS schema sync drift check
        working-directory: ts
        run: uv run --frozen --project ../autocontext -- npm run check:schemas

  dependency-security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: false
      - name: Install pinned Python audit tool
        working-directory: autocontext
        run: uv sync --locked --group dev
      - name: Audit every Python dependency group and extra
        working-directory: autocontext
        run: |
          uv export --quiet --locked --all-groups --all-extras --no-emit-project --format requirements-txt --output-file /tmp/autocontext-all-requirements.lock
          uv run --frozen pip-audit -r /tmp/autocontext-all-requirements.lock --disable-pip --strict
      - name: Audit TypeScript npm lock
        working-directory: ts
        run: npm audit --omit=dev --audit-level=moderate
      - name: Audit TypeScript Bun lock
        working-directory: ts
        run: bun audit --prod --audit-level=moderate
      - name: Audit Pi npm lock
        working-directory: pi
        run: npm audit --omit=dev --audit-level=moderate

  # AC-909: the TypeScript type gate. Without this the 833-file clean test
  # suite has no ratchet: tsconfig.json excludes tests/, so a drifting test
  # only surfaces here. `npm run lint` is tsc --noEmit + check:test-types
  # (all test files) + the generated root-index check.
  ts-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: ts/.nvmrc
      - name: Install TypeScript deps
        run: npm ci --ignore-scripts
      - name: Lint (tsc, test types, root index)
        run: npm run lint

  ts-test-shards:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Report every shard's result in one run rather than stopping at the first
      # failure, so a real test failure surfaces everywhere it occurs.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: ts
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: ts/.nvmrc
      - name: Reuse setup-node headers for native addons
        shell: bash
        run: |
          nodedir="$(dirname "$(dirname "$(command -v node)")")"
          test -d "$nodedir/include/node"
          echo "npm_config_nodedir=$nodedir" >> "$GITHUB_ENV"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: false
      - name: Install Python parity deps
        working-directory: autocontext
        run: uv sync --locked --group dev
      - name: Install TypeScript deps
        run: npm ci --ignore-scripts
      - name: Rebuild native modules (better-sqlite3, isolated-vm)
        run: npm rebuild better-sqlite3 isolated-vm
      - name: Run TypeScript test shard ${{ matrix.shard }}/4
        # The suite is sharded (AC-892): each runner shepherds ~1/4 of the
        # 5,600+ task updates instead of all of them, so the vitest host
        # process no longer starves the worker RPC channel and fails with
        # "Timeout calling onTaskUpdate" on saturated runners. The dot reporter
        # and capped workers still keep each shard's host responsive.
        run: npm test -- --reporter=dot --shard=${{ matrix.shard }}/4 --maxWorkers=2
        env:
          # Sync Python subprocess spawns in the hashing-parity property tests
          # block vitest workers long enough to starve the worker RPC channel
          # on saturated runners; 25 runs keeps the parity check meaningful
          # while staying under the RPC timeout. Local runs default to 100.
          HASHING_PARITY_NUM_RUNS: "25"

  # Single required-status context: branch protection keeps requiring "ts-test"
  # unchanged, and it is green only when every shard is green.
  ts-test:
    if: always()
    needs: [ts-test-shards]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all ts-test shards passed
        run: |
          if [ "${{ needs.ts-test-shards.result }}" != "success" ]; then
            echo "one or more ts-test shards failed"
            exit 1
          fi
          echo "all ts-test shards passed"

  smoke:
    needs: [lint, test, package-boundaries]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: autocontext
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: false
      - name: Install
        run: uv sync --locked --group dev
      - name: Deterministic scenario runs
        env:
          AUTOCONTEXT_AGENT_PROVIDER: deterministic
        run: |
          uv run python -m autocontext.cli run --scenario grid_ctf --gens 3 --run-id ci_smoke_grid
          uv run python -m autocontext.cli run --scenario othello --gens 1 --run-id ci_smoke_othello
      - name: Dashboard API smoke
        env:
          AUTOCONTEXT_AGENT_PROVIDER: deterministic
        run: |
          cleanup() { kill $SERVER_PID 2>/dev/null || true; }
          trap cleanup EXIT
          uv run autoctx serve --host 127.0.0.1 --port 8010 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8010/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8010/health
          curl -fsS http://127.0.0.1:8010/api/runs

  # ────────────────────────────────────────────────────────────────────────────
  # OpenAI SDK version-pin matrix (A2-II-b Task 7.4)
  # Tests the OpenAI integration against the 3 most-recent 1.x patches (Python)
  # and 3 most-recent 4.x patches (TypeScript).
  #
  # Python: 1.82.0, 1.83.0, 1.84.0   (latest 3 minor patches of openai 1.x)
  # TS:     4.102.0, 4.103.0, 4.104.0 (latest 3 minor patches of openai 4.x)
  # ────────────────────────────────────────────────────────────────────────────
  openai-sdk-matrix-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        openai-version: ["1.82.0", "1.83.0", "1.84.0"]
    defaults:
      run:
        working-directory: autocontext
    env:
      OPENAI_VERSION: ${{ matrix.openai-version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: false
      - name: Install base deps
        run: uv sync --locked --group dev
      - name: Pin openai to matrix version
        run: uv pip install --exclude-newer 2026-05-05T00:00:00Z "openai==$OPENAI_VERSION"
      - name: Run OpenAI integration tests
        run: uv run pytest tests/production_traces/ tests/integrations/ -q -m "not live"

  openai-sdk-matrix-ts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        openai-version: ["4.102.0", "4.103.0", "4.104.0"]
    defaults:
      run:
        working-directory: ts
    env:
      OPENAI_VERSION: ${{ matrix.openai-version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - name: Reuse setup-node headers for native addons
        shell: bash
        run: |
          nodedir="$(dirname "$(dirname "$(command -v node)")")"
          test -d "$nodedir/include/node"
          echo "npm_config_nodedir=$nodedir" >> "$GITHUB_ENV"
      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: false
      - name: Install Python parity deps
        working-directory: autocontext
        run: uv sync --locked --group dev
      - name: Install base deps
        run: npm ci --ignore-scripts
      - name: Pin openai to matrix version
        run: npm install --ignore-scripts --no-save "openai@$OPENAI_VERSION"
      - name: Run OpenAI integration tests
        run: npm test -- --run --reporter=verbose tests/integrations/ tests/control-plane/instrument/

  # ────────────────────────────────────────────────────────────────────────────
  # Anthropic SDK version-pin matrix (A2-III)
  # Tests the Anthropic integration against the 3 most-recent 0.x patches (Python)
  # and 3 most-recent 0.x patches (TypeScript @anthropic-ai/sdk).
  #
  # Python: 0.49.0, 0.50.0, 0.51.0   (latest 3 minor patches of anthropic 0.x)
  # TS:     0.39.0, 0.40.0, 0.41.0   (latest 3 minor patches of @anthropic-ai/sdk 0.x)
  # ────────────────────────────────────────────────────────────────────────────
  anthropic-sdk-matrix-python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        anthropic-version: ["0.49.0", "0.50.0", "0.51.0"]
    defaults:
      run:
        working-directory: autocontext
    env:
      ANTHROPIC_VERSION: ${{ matrix.anthropic-version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: false
      - name: Install base deps
        run: uv sync --locked --group dev
      - name: Pin anthropic to matrix version
        run: uv pip install --exclude-newer 2026-05-05T00:00:00Z "anthropic==$ANTHROPIC_VERSION"
      - name: Run Anthropic integration tests
        run: uv run pytest tests/production_traces/ tests/integrations/ -q -m "not live"

  anthropic-sdk-matrix-ts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        anthropic-version: ["0.39.0", "0.40.0", "0.41.0"]
    defaults:
      run:
        working-directory: ts
    env:
      ANTHROPIC_VERSION: ${{ matrix.anthropic-version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: false
      - name: Install Python parity deps
        working-directory: autocontext
        run: uv sync --locked --group dev
      - name: Install base deps
        run: npm ci --ignore-scripts
      - name: Pin anthropic to matrix version
        run: npm install --ignore-scripts --no-save "@anthropic-ai/sdk@$ANTHROPIC_VERSION"
      - name: Run Anthropic integration tests
        run: npm test -- --run --reporter=verbose tests/integrations/ tests/control-plane/instrument/

  primeintellect-live:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: autocontext
    env:
      AUTOCONTEXT_PRIMEINTELLECT_API_KEY: ${{ secrets.AUTOCONTEXT_PRIMEINTELLECT_API_KEY }}
      AUTOCONTEXT_ANTHROPIC_API_KEY: ${{ secrets.AUTOCONTEXT_ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          enable-cache: false
      - name: Install
        run: uv sync --locked --group dev
      - name: Live PrimeIntellect verification
        if: ${{ env.AUTOCONTEXT_PRIMEINTELLECT_API_KEY != '' && env.AUTOCONTEXT_ANTHROPIC_API_KEY != '' }}
        env:
          AUTOCONTEXT_EXECUTOR_MODE: primeintellect
          AUTOCONTEXT_PRIMEINTELLECT_API_BASE: https://api.primeintellect.ai
          AUTOCONTEXT_AGENT_PROVIDER: anthropic
        run: uv run autoctx run --scenario grid_ctf --gens 1 --run-id ci_prime_live
      - name: Live PrimeIntellect accelerator verification
        if: >-
          ${{ env.AUTOCONTEXT_PRIMEINTELLECT_API_KEY != '' &&
              env.AUTOCONTEXT_ANTHROPIC_API_KEY != '' &&
              vars.AUTOCONTEXT_PRIMEINTELLECT_LIVE_ACCELERATOR_KIND != '' &&
              vars.AUTOCONTEXT_PRIMEINTELLECT_LIVE_ACCELERATOR_COUNT != '' &&
              vars.AUTOCONTEXT_PRIMEINTELLECT_LIVE_REGION != '' &&
              vars.AUTOCONTEXT_PRIMEINTELLECT_LIVE_IMAGE != '' }}
        env:
          AUTOCONTEXT_EXECUTOR_MODE: primeintellect
          AUTOCONTEXT_PRIMEINTELLECT_API_BASE: https://api.primeintellect.ai
          AUTOCONTEXT_AGENT_PROVIDER: anthropic
          AUTOCONTEXT_PRIMEINTELLECT_ACCELERATOR_KIND: ${{ vars.AUTOCONTEXT_PRIMEINTELLECT_LIVE_ACCELERATOR_KIND }}
          AUTOCONTEXT_PRIMEINTELLECT_ACCELERATOR_COUNT: ${{ vars.AUTOCONTEXT_PRIMEINTELLECT_LIVE_ACCELERATOR_COUNT }}
          AUTOCONTEXT_PRIMEINTELLECT_REGION: ${{ vars.AUTOCONTEXT_PRIMEINTELLECT_LIVE_REGION }}
          AUTOCONTEXT_PRIMEINTELLECT_SUPPORTED_ACCELERATOR_KINDS: ${{ vars.AUTOCONTEXT_PRIMEINTELLECT_LIVE_ACCELERATOR_KIND }}
          AUTOCONTEXT_PRIMEINTELLECT_MAX_ACCELERATOR_COUNT: ${{ vars.AUTOCONTEXT_PRIMEINTELLECT_LIVE_ACCELERATOR_COUNT }}
          AUTOCONTEXT_PRIMEINTELLECT_SUPPORTED_REGIONS: ${{ vars.AUTOCONTEXT_PRIMEINTELLECT_LIVE_REGION }}
          AUTOCONTEXT_PRIMEINTELLECT_SUPPORTED_IMAGES: ${{ vars.AUTOCONTEXT_PRIMEINTELLECT_LIVE_IMAGE }}
          AUTOCONTEXT_PRIMEINTELLECT_DOCKER_IMAGE: ${{ vars.AUTOCONTEXT_PRIMEINTELLECT_LIVE_IMAGE }}
          AUTOCONTEXT_PRIMEINTELLECT_REQUIRED_TELEMETRY: hardware_identity
          AUTOCONTEXT_PRIMEINTELLECT_AVAILABLE_TELEMETRY: hardware_identity
        run: uv run autoctx run --scenario grid_ctf --gens 1 --run-id ci_prime_accelerator_live
