x-runtime-security: &runtime-security
  cap_drop:
    - ALL
  init: true
  pids_limit: 256
  read_only: true
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=64m

services:
  autocontext:
    <<: *runtime-security
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    environment:
      AUTOCONTEXT_DB_PATH: /workspace/runs/autocontext.sqlite3
      AUTOCONTEXT_RUNS_ROOT: /workspace/runs
      AUTOCONTEXT_KNOWLEDGE_ROOT: /workspace/knowledge
      AUTOCONTEXT_SKILLS_ROOT: /workspace/skills
      AUTOCONTEXT_EXECUTOR_MODE: local
      AUTOCONTEXT_AGENT_PROVIDER: deterministic
    volumes:
      - autocontext-runs:/workspace/runs
      - autocontext-knowledge:/workspace/knowledge
      - autocontext-skills:/workspace/skills
    command: run --scenario grid_ctf --gens 1
  dashboard:
    <<: *runtime-security
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    environment:
      AUTOCONTEXT_DB_PATH: /workspace/runs/autocontext.sqlite3
      AUTOCONTEXT_RUNS_ROOT: /workspace/runs
      AUTOCONTEXT_KNOWLEDGE_ROOT: /workspace/knowledge
      AUTOCONTEXT_SKILLS_ROOT: /workspace/skills
      AUTOCONTEXT_AGENT_PROVIDER: deterministic
      AUTOCONTEXT_SERVER_TOKEN: ${AUTOCONTEXT_SERVER_TOKEN:?set a random value of at least 32 characters}
    volumes:
      - autocontext-runs:/workspace/runs
      - autocontext-knowledge:/workspace/knowledge
      - autocontext-skills:/workspace/skills
      - ../../autocontext/dashboard:/workspace/dashboard:ro
    command: serve --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  autocontext-runs:
  autocontext-knowledge:
  autocontext-skills:
